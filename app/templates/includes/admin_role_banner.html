{% if current_user.is_authenticated and current_user.is_admin %}
<div class="admin-role-banner mb-4" role="status" aria-live="polite">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div>
            <span class="admin-role-badge">Administrator</span>
            <strong class="ms-2">You are logged in as Admin</strong>
            <span class="text-muted ms-1">— {{ current_user.full_name }}</span>
        </div>
        <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-sm btn-dark">Admin Home</a>
    </div>
    <p class="mb-0 mt-2 small text-muted">
        Manage accounts, import datasets, run EDA, train models, and persist the best-performing model.
    </p>
</div>
{% endif %}
